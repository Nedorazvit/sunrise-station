- type: entity
  parent: BaseAction
  id: ActionToggleTRay
  name: toggle t-ray scanner
  description: Toggle the built-in t-ray scanner on or off.
  components:
  - type: Action
    useDelay: 1
    priority: -9
    icon: { sprite: Objects/Tools/t-ray.rsi, state: tray-off }
    iconOn: { sprite: Objects/Tools/t-ray.rsi, state: tray-on }
  - type: InstantAction
    event: !type:ToggleActionEvent
